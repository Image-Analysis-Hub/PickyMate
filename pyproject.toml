[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pickymate"
version = "0.1.0"
description = "Tomogram particle picking and triage, ranked by embedding similarity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "mrcfile>=1.4",
    "h5py>=3.0",
    "pandas>=1.5",
    # the session map: one UMAP over every tomogram of a session
    "umap-learn>=0.5",
]

[project.optional-dependencies]
# pytest for the tests, matplotlib for docs/make_figures.py; neither is needed to run PickyMate
dev = ["pytest", "matplotlib>=3.5"]

[project.scripts]
# the `pickymate` command; `python tomo_boxer.py` keeps working as well
pickymate = "tomo_boxer:main"

[tool.setuptools]
py-modules = ["tomo_boxer"]
packages = ["boxer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["dataset: the original end-to-end scripts; need EMPIAR-10988 on disk, skipped without it"]
